name: refresh

# Every 2 hours (CelesTrak's update interval), off the top of the hour when
# runners are busiest. `orbital refresh` decides per feed whether it is due,
# using ingest_runs in the database, so Space-Track's limits hold here too.
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SPACETRACK_IDENTITY: ${{ secrets.SPACETRACK_IDENTITY }}
      SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
      CELESTRAK_USER_AGENT: ${{ secrets.CELESTRAK_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e .
      - run: alembic upgrade head
      - run: orbital refresh
