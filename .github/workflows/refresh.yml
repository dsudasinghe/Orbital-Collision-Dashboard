name: refresh

# Every 30 minutes, off the top of the hour when runners are busiest. GitHub
# drops scheduled runs under load, so triggering often keeps the data fresh;
# `orbital refresh` decides per feed whether it is actually due (CelesTrak 2 h,
# Space-Track 8 h) using ingest_runs, so extra triggers cost one DB query.
# `orbital screen` likewise runs at most every 20 h (about 3 minutes when due).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SPACETRACK_IDENTITY: ${{ secrets.SPACETRACK_IDENTITY }}
      SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
      CELESTRAK_USER_AGENT: ${{ secrets.CELESTRAK_USER_AGENT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e .
      - run: alembic upgrade head
      - run: orbital refresh
      # Screen after fresh elements are in. Runs even if a feed failed, using
      # the latest elements held.
      - run: orbital screen
        if: ${{ !cancelled() }}
      # Space-Track publishes events after we screen, so re-check the latest run.
      - run: orbital validate
        if: ${{ !cancelled() }}
