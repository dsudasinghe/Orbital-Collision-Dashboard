[project]
name = "orbital"
version = "0.1.0"
description = "Orbital collision-risk dashboard backend: ingest, propagation, screening, ML."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "sgp4>=2.23",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orbital = "orbital.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs DATABASE_URL pointing at a real Postgres"]
